    - name: Restore Playwright browser cache
      id: playwright_l1_cache
      if: contains(matrix.component, 'playwright') || contains(matrix.component, 'e2e')
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/packages/testing/playwright/package.json', 'pnpm-workspace.yaml', 'package.json', 'pnpm-lock.yaml') }}
        path: |-
          ~/.cache/ms-playwright
          /tmp/.cache/ms-playwright
        restore-keys: ${{ runner.os }}-playwright-
    - name: Restore Python build & venv cache
      id: python_l1_cache
      if: hashFiles('pyproject.toml', 'requirements.txt') != ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
        path: |-
          /tmp/.cache/uv
          ~/.cache/pip
          .venv
        restore-keys: ${{ runner.os }}-python-
    - name: Restore Go build cache
      id: go_l1_cache
      if: hashFiles('go.mod', 'go.sum') != ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        path: |-
          /tmp/go-build
          /tmp/go/pkg/mod
        restore-keys: ${{ runner.os }}-go-
    - name: Restore Rust target & cargo cache
      id: rust_l1_cache
      if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
        path: |-
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/
        restore-keys: ${{ runner.os }}-rust-
    - name: Pre-warm Database Template Snapshot from Cloudflare R2
      if: ${{ env.ENACT_SNAPSHOT_NAME != '' || contains(matrix.component, 'db') || contains(matrix.component, 'cli') }}
      continue-on-error: true
      run: |-
        if [ -n "$ENACT_R2_BUCKET" ]; then
          SNAPSHOT_NAME="${ENACT_SNAPSHOT_NAME:-base_template.dump.zst}"
          mkdir -p "$HOME/.cache/enact/snapshots"
          if [ ! -s "$HOME/.cache/enact/snapshots/$SNAPSHOT_NAME" ]; then
            echo "🌐 Pre-warming base template snapshot from Cloudflare R2..."
            curl -fsSL --connect-timeout 5 --max-time 60 --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" --aws-sigv4 "aws:amz:auto:s3" "${ENACT_R2_BUCKET%/}/snapshots/$SNAPSHOT_NAME" -o "$HOME/.cache/enact/snapshots/$SNAPSHOT_NAME" 2>/dev/null || true
          fi
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENACT_SNAPSHOT_NAME: ${{ matrix.snapshot_name || env.ENACT_SNAPSHOT_NAME }}
    - name: Pre-warm Playwright Browsers from Cloudflare R2
      if: ${{ contains(matrix.component, 'e2e') || contains(matrix.component, 'playwright') }}
      continue-on-error: true
      run: |-
        if [ "${{ steps.playwright_l1_cache.outputs.cache-hit }}" != "true" ] && [ -n "$ENACT_R2_BUCKET" ]; then
          echo "🌐 Pre-warming Playwright browsers from Cloudflare R2..."
          mkdir -p "$HOME/.cache/ms-playwright" "/tmp/.cache/ms-playwright"
          curl -fsSL --connect-timeout 5 --max-time 60 --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" --aws-sigv4 "aws:amz:auto:s3" "${ENACT_R2_BUCKET%/}/tools/playwright-browsers-linux-amd64.tar.zst" 2>/dev/null | tar -x --zstd -C "$HOME/.cache/ms-playwright" 2>/dev/null || true
          cp -r "$HOME/.cache/ms-playwright/." "/tmp/.cache/ms-playwright/" 2>/dev/null || true
        fi
        mkdir -p "$HOME/.cache/ms-playwright" "/tmp/.cache/ms-playwright"
        if [ -d "$HOME/.cache/ms-playwright" ] && [ ! -d "/tmp/.cache/ms-playwright/chromium-1234" ]; then
          cp -r "$HOME/.cache/ms-playwright/." "/tmp/.cache/ms-playwright/" 2>/dev/null || true
        fi
        echo "PLAYWRIGHT_BROWSERS_PATH=/tmp/.cache/ms-playwright" >> "$GITHUB_ENV"
        BROWSER_BIN=$(fd --type f --perm /111 "chrome-headless-shell" /tmp/.cache/ms-playwright "$HOME/.cache/ms-playwright" 2>/dev/null | head -n 1)
        if [ -n "$BROWSER_BIN" ]; then
          echo "BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          echo "🌐 Configured browser binary: $BROWSER_BIN"
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
    - name: Restore Nix Store (L1 GHA Cache)
      id: nix_l1_cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-nix-store-${{ hashFiles('**/enve.lock') }}
        path: |-
          /nix/store
          ~/.local/share/enve/store
        restore-keys: |
          ${{ runner.os }}-nix-store-
    - name: Pull Dependencies via enve
      run: |-
        if [ -f "enve.lock" ]; then
          if [ "${{ steps.nix_l1_cache.outputs.cache-hit }}" != "true" ] && [ -n "$ENACT_R2_BUCKET" ]; then
            enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" --insecure -j 16
          fi
          enve run $([ -f enve.lock ] && echo --locked) -- true
        fi
        if [ -n "${{ matrix.component_dir }}" ] && [ "${{ matrix.component_dir }}" != "." ] && [ -f "${{ matrix.component_dir }}/enve.lock" ]; then
          if [ "${{ steps.nix_l1_cache.outputs.cache-hit }}" != "true" ] && [ -n "$ENACT_R2_BUCKET" ]; then
            enve cache pull "${{ matrix.component_dir }}/enve.lock" --cache "$ENACT_R2_BUCKET" --insecure -j 16
          fi
          (cd "${{ matrix.component_dir }}" && enve run $([ -f enve.lock ] && echo --locked) -- true)
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: '16'
    - name: Install Project Dependencies
      if: ${{ hashFiles('package.json', 'pnpm-lock.yaml') != '' }}
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run $([ -f enve.lock ] && echo --locked) -- "
        fi
        FILTER_ARGS=""
        if [ -n "${{ matrix.filter_args }}" ]; then
          FILTER_ARGS="${{ matrix.filter_args }}"
        fi
        if [ -f "pnpm-lock.yaml" ]; then
          echo "📦 Installing project dependencies via pnpm..."
          $RUN_PREFIX pnpm config set fetch-retries 2 2>/dev/null || true
          $RUN_PREFIX pnpm config set fetch-retry-maxtimeout 10000 2>/dev/null || true
          $RUN_PREFIX pnpm config set network-concurrency 16 2>/dev/null || true
          $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink 2>/dev/null || $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink 2>/dev/null || $RUN_PREFIX pnpm install $FILTER_ARGS --no-frozen-lockfile --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink
        elif [ -f "package-lock.json" ]; then
          echo "📦 Installing project dependencies via npm..."
          $RUN_PREFIX npm ci --prefer-offline 2>/dev/null || $RUN_PREFIX npm install
        fi
        git checkout -- pnpm-lock.yaml package-lock.json yarn.lock bun.lockb 2>/dev/null || true
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Execute Component Task
      run: ${{ matrix.command }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        BROWSER_BIN: ${{ env.BROWSER_BIN }}
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        PLAYWRIGHT_BROWSERS_PATH: /tmp/.cache/ms-playwright
    - name: Push Updated Dependencies to Cloudflare R2
      if: success()
      continue-on-error: true
      run: |-
        if [ -n "$ENACT_R2_BUCKET" ]; then
          if [ -f "enve.lock" ]; then
            echo "🛰️ Pushing missing/updated closures to Cloudflare R2 from repository root..."
            enve cache push enve.lock --cache "$ENACT_R2_BUCKET" -j 16 || true
          fi
          if [ -n "${{ matrix.component_dir }}" ] && [ "${{ matrix.component_dir }}" != "." ] && [ -f "${{ matrix.component_dir }}/enve.lock" ]; then
            echo "🛰️ Pushing missing/updated closures to Cloudflare R2 from ${{ matrix.component_dir }}..."
            (cd "${{ matrix.component_dir }}" && enve cache push enve.lock --cache "$ENACT_R2_BUCKET" -j 16) || true
          fi
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: '16'
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/telemetry.json
          .enact/summary.html
        retention-days: '1'
    - name: Save Python build & venv cache
      if: (github.event_name == 'push' || github.event_name == 'pull_request') && hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.python_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
        path: |-
          /tmp/.cache/uv
          ~/.cache/pip
          .venv
    - name: Save Go build cache
      if: (github.event_name == 'push' || github.event_name == 'pull_request') && hashFiles('go.mod', 'go.sum') != '' && steps.go_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        path: |-
          /tmp/go-build
          /tmp/go/pkg/mod
    - name: Save Rust target & cargo cache
      if: (github.event_name == 'push' || github.event_name == 'pull_request') && hashFiles('Cargo.toml', 'Cargo.lock') != '' && steps.rust_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
        path: |-
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/
    - name: Save Playwright browser cache
      if: (github.event_name == 'push' || github.event_name == 'pull_request') && (contains(matrix.component, 'playwright') || contains(matrix.component, 'e2e')) && steps.playwright_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/packages/testing/playwright/package.json', 'pnpm-workspace.yaml', 'package.json', 'pnpm-lock.yaml') }}
        path: |-
          ~/.cache/ms-playwright
          /tmp/.cache/ms-playwright
    - name: Save Nix Store (L1 GHA Cache)
      if: (github.event_name == 'push' || github.event_name == 'pull_request') && steps.nix_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-nix-store-${{ hashFiles('**/enve.lock') }}
        path: |-
          /nix/store
          ~/.local/share/enve/store
