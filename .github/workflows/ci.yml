          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          cp -f "$BIN_DIR"/* "$HOME/.cargo/bin/" 2>/dev/null || true
          chmod +x "$HOME/.cargo/bin"/* "$BIN_DIR"/* 2>/dev/null || true
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
