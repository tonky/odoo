    - name: Restore Node & TypeScript build cache
      id: node_l1_cache
      if: hashFiles('package.json', 'pnpm-lock.yaml') != ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-node-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lockb') }}
