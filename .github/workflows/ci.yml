    - name: Restore enact CLI binary cache
      id: enact_cli_cache
      if: hashFiles('bin/enact') == ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
        path: ~/.cargo/bin/enact
        restore-keys: ${{ runner.os }}-enact-cli-
    - name: Restore enact Task CAS Cache
      id: enact-tasks-cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
        path: .enact/cache
        restore-keys: ${{ runner.os }}-enact-tasks-
    - name: Ensure enve & enact CLI on PATH
      run: |-
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix /nix/store 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ] && [ ! -e "/nix/store" ]; then
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          cp -f "$BIN_DIR"/* "$HOME/.cargo/bin/" 2>/dev/null || true
          chmod +x "$HOME/.cargo/bin"/* "$BIN_DIR"/* 2>/dev/null || true
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"
    - name: Restore Nix Store (L1 GHA Cache)
      id: nix_l1_cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-nix-store-${{ hashFiles('**/enve.lock') }}
        path: |-
          /nix/store
          ~/.local/share/enve/store
        restore-keys: |
          ${{ runner.os }}-nix-store-
    - name: Pull Dependencies via enve
      run: |-
        if [ -f "enve.lock" ]; then
          if [ "${{ steps.nix_l1_cache.outputs.cache-hit }}" != "true" ] && [ -n "$ENACT_R2_BUCKET" ]; then
            enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" --insecure -j 16
          fi
          enve run $([ -f enve.lock ] && echo --locked) -- true
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: '16'
    - name: Restore Node & TypeScript build cache
      id: node_l1_cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-node-stage-preflight-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lockb') }}
        path: |-
          ~/.local/share/pnpm/store
          ~/.cache/pnpm
          ~/.npm
          node_modules/.cache
          .turbo
          .turbo/cache
          packages/*/dist
          packages/@n8n/*/dist
          packages/frontend/@n8n/*/dist
        restore-keys: ${{ runner.os }}-node-stage-preflight-
    - name: Install Project Dependencies
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run $([ -f enve.lock ] && echo --locked) -- "
        fi
        FILTER_ARGS=""
        if [ -f "pnpm-lock.yaml" ]; then
          echo "📦 Installing project dependencies via pnpm..."
          $RUN_PREFIX pnpm config set fetch-retries 2 2>/dev/null || true
          $RUN_PREFIX pnpm config set fetch-retry-maxtimeout 10000 2>/dev/null || true
          $RUN_PREFIX pnpm config set network-concurrency 16 2>/dev/null || true
          $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink 2>/dev/null || $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink 2>/dev/null || $RUN_PREFIX pnpm install $FILTER_ARGS --no-frozen-lockfile --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink
        elif [ -f "package-lock.json" ]; then
          echo "📦 Installing project dependencies via npm..."
          $RUN_PREFIX npm ci --prefer-offline 2>/dev/null || $RUN_PREFIX npm install
        fi
        git checkout -- pnpm-lock.yaml package-lock.json yarn.lock bun.lockb 2>/dev/null || true
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify Workspace Package Integrity
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run $([ -f enve.lock ] && echo --locked) -- "
        fi
        if [ -f "scripts/check-workspace-private-deps.mjs" ]; then
          echo "🔍 Checking workspace package dependencies..."
          $RUN_PREFIX node scripts/check-workspace-private-deps.mjs
        fi
    - name: Verify Pipeline Contracts & Sparse Cones (enact ci-verify)
      run: |-
        ENACT_BIN=""
        if [ -x "bin/enact" ]; then
          ENACT_BIN="bin/enact"
        elif command -v enact >/dev/null 2>&1; then
          ENACT_BIN="enact"
        fi
        if [ -n "$ENACT_BIN" ]; then
          echo "🔬 Running enact ci-verify..."
          $ENACT_BIN ci-verify --pipeline .enact
        fi
    - name: Execute Stage [Preflight Quality Gate]
      run: |-
        UPDATED_ARG=""
        if [ "${{ inputs.all }}" = "true" ]; then
          UPDATED_ARG="--all"
        elif [ -n "${{ inputs.updated }}" ]; then
          UPDATED_ARG="--updated ${{ inputs.updated }}"
        fi
        NO_CACHE_ARG=""
        if [ "${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.labels.*.name, 'no-cache') || contains(github.event.pull_request.labels.*.name, 'showcase') || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}" = "true" ]; then
          NO_CACHE_ARG="--no-cache"
        fi
        BASE_ARG=""
        BASE_REF="${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}"
        if [ -z "$BASE_REF" ]; then
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE_REF="${{ github.event.before }}"
            else
              BASE_REF="HEAD~1"
            fi
          else
            if [ "${{ github.ref_name }}" != "perf/ci-modernization" ] && [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch || 'master' }}" ]; then
              if ! git rev-parse --verify origin/perf/ci-modernization >/dev/null 2>&1; then
                git fetch --no-tags --depth=50 origin perf/ci-modernization 2>/dev/null || true
              fi
              if git rev-parse --verify origin/perf/ci-modernization >/dev/null 2>&1; then
                BASE_REF="perf/ci-modernization"
              fi
            fi
            if [ -z "$BASE_REF" ]; then
              BASE_REF="${{ github.event.repository.default_branch || 'master' }}"
            fi
          fi
        fi
        if [ -n "$BASE_REF" ]; then
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 && ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            git fetch --no-tags --depth=50 origin "$BASE_REF" 2>/dev/null || git fetch --deepen=50 2>/dev/null || true
          fi
          MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ]; then
            BASE_ARG="--base $MERGE_BASE"
          elif git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_ARG="--base $BASE_REF"
          elif git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            BASE_ARG="--base origin/$BASE_REF"
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ "${{ github.event_name }}" = "push" ]; then
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_ARG="--base HEAD~1"
          fi
        fi
        enact run --pipeline .enact $BASE_ARG $UPDATED_ARG $NO_CACHE_ARG preflight
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
    - name: Save Node & TypeScript build cache
      if: github.event_name == 'push' && steps.node_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-node-stage-preflight-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lockb') }}
        path: |-
          ~/.local/share/pnpm/store
          ~/.cache/pnpm
          ~/.npm
          node_modules/.cache
          .turbo
          .turbo/cache
          packages/*/dist
          packages/@n8n/*/dist
          packages/frontend/@n8n/*/dist
    - name: Save Nix Store (L1 GHA Cache)
      if: (github.event_name == 'push' || github.event_name == 'pull_request') && steps.nix_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ runner.os }}-nix-store-${{ hashFiles('**/enve.lock') }}
        path: |-
          /nix/store
          ~/.local/share/enve/store
    - name: Upload Telemetry for [preflight]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-preflight
        path: |-
          .enact/telemetry.json
          .enact/summary.html
        retention-days: '1'
  summary:
    name: Telemetry & Summary
    needs:
    - detect
    - preflight
    - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Repository (sparse)
      uses: actions/checkout@v7
      with:
        fetch-depth: '1'
        fetch-tags: 'false'
        filter: blob:none
        lfs: 'false'
        show-progress: 'false'
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          setup
          bin
          enve.cue
          enve.lock
        sparse-checkout-cone-mode: 'true'
        submodules: 'false'
    - name: Restore enact CLI binary cache
      id: enact_cli_cache
      if: hashFiles('bin/enact') == ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
        path: ~/.cargo/bin/enact
        restore-keys: ${{ runner.os }}-enact-cli-
    - name: Ensure enve & enact CLI on PATH
      run: |-
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix /nix/store 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ] && [ ! -e "/nix/store" ]; then
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          cp -f "$BIN_DIR"/* "$HOME/.cargo/bin/" 2>/dev/null || true
          chmod +x "$HOME/.cargo/bin"/* "$BIN_DIR"/* 2>/dev/null || true
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"
    - name: Download All Component Telemetry
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: .enact/telemetry
        pattern: telemetry-*
    - name: Generate Consolidated Telemetry Summary
      continue-on-error: true
      run: enact report --dir .enact/telemetry
    - name: Upload Master Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-workflow-summary
        path: .enact/summary.html
        retention-days: '1'
  test:
    name: Run Tests (${{ matrix.component }})
    needs:
    - detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 10
    steps:
    - name: Checkout Repository (sparse)
      if: ${{ matrix.sparse_checkout != '' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: '1'
        fetch-tags: 'false'
        filter: blob:none
        lfs: 'false'
        show-progress: 'false'
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: 'true'
        submodules: 'false'
    - name: Checkout Repository (full)
      if: ${{ matrix.sparse_checkout == '' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: '1'
        fetch-tags: 'false'
        filter: blob:none
        lfs: 'false'
        show-progress: 'false'
        submodules: 'false'
    - name: Restore enact CLI binary cache
      id: enact_cli_cache
      if: hashFiles('bin/enact') == ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
        path: ~/.cargo/bin/enact
        restore-keys: ${{ runner.os }}-enact-cli-
