        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          odoo-bin
          requirements.txt
          setup.py
          setup.cfg
          pyproject.toml
          Justfile
          oxlint.json
          ruff.toml
          uv.lock
          helpers
          odoo
          setup
          addons/api_doc
          addons/auth_passkey
          addons/auth_totp
          addons/base_import
          addons/base_import_module
          addons/base_setup
          addons/bus
          addons/html_editor
          addons/http_routing
          addons/iap
          addons/rpc
          addons/web
          addons/web_tour
          addons/web_unsplash
    - name: Checkout Repository (sparse)
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          odoo-bin
          requirements.txt
          setup.py
          setup.cfg
          pyproject.toml
          Justfile
          oxlint.json
          ruff.toml
          uv.lock
          helpers
          odoo
          setup
          addons/api_doc
          addons/auth_passkey
          addons/auth_totp
          addons/base_import
          addons/base_import_module
          addons/base_setup
          addons/bus
          addons/html_editor
          addons/http_routing
          addons/iap
          addons/rpc
          addons/web
          addons/web_tour
          addons/web_unsplash
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Restore enact Task CAS Cache
      id: enact-tasks-cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
        path: .enact/state/cache
        restore-keys: ${{ runner.os }}-enact-tasks-
    - name: Restore Reach Store
      id: reach-store
