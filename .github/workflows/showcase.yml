name: odoo-showcase-benchmark
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Upstream PR number or URL (e.g. 189528 or commit SHA)'
        required: false
      head_ref:
        description: 'PR / Feature revision (commit SHA or branch name)'
        required: false
      base_ref:
        description: 'Target base branch for diff detection (default: master)'
        required: false
        default: 'master'
      upstream_repo:
        description: 'Upstream GitHub repo (default: odoo/odoo)'
        required: false
        default: 'odoo/odoo'
      no_cache:
        description: 'Disable enact task cache, forcing full execution'
        required: false
        default: 'false'
      all:
        description: 'Force execution of all components regardless of git changes'
        required: false
        default: 'false'
  pull_request:
    branches:
      - 'showcase/**'
      - 'perf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  ENVE_SERVICE_GID: '1000'
  ENVE_SERVICE_UID: '1000'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache

jobs:
  detect:
    name: Prepare & Detect Affected Components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      base_sha: ${{ steps.prep.outputs.base_sha }}
      head_sha: ${{ steps.prep.outputs.head_sha }}
      pr_title: ${{ steps.prep.outputs.pr_title }}
      pr_url: ${{ steps.prep.outputs.pr_url }}
      has_upstream_baseline: ${{ steps.prep.outputs.has_upstream_baseline }}
      upstream_cpu_minutes: ${{ steps.prep.outputs.upstream_cpu_minutes }}
      upstream_wall_minutes: ${{ steps.prep.outputs.upstream_wall_minutes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: '100'
          fetch-tags: 'false'
          filter: blob:none
          lfs: 'false'
          show-progress: 'false'
          submodules: 'false'

      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-

      - name: Ensure enve & enact CLI on PATH
        run: |
          git config --global --add safe.directory "*" 2>/dev/null || true
          mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p -m 0755 /nix 2>/dev/null || true
            sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
          fi
          if [ -d "/nix" ]; then
            if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
              cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
              rm -rf /nix/store 2>/dev/null || true
            fi
            ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
          fi
          BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
          if [ -d "$BIN_DIR" ]; then
            for b in enact enve; do
              if [ -f "$BIN_DIR/$b" ]; then
                cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
                chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
              fi
            done
            echo "$BIN_DIR" >> "$GITHUB_PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"

      - name: Prepare Showcase Environment & Scrape Upstream CI
        id: prep
        run: |
          python3 tools/showcase/prepare-showcase-env.py \
            --pr "${{ inputs.pr }}" \
            --head "${{ inputs.head_ref || github.event.pull_request.head.sha }}" \
            --base "${{ inputs.base_ref || github.event.pull_request.base.ref || 'master' }}" \
            --repo "${{ inputs.upstream_repo || 'odoo/odoo' }}" \
            --workspace "${GITHUB_WORKSPACE:-$PWD}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Affected Component Matrix via Enact Reachability
        id: diff
        run: |
          UPDATED_ARG=""
          if [ "${{ inputs.all }}" = "true" ]; then
            UPDATED_ARG="--all"
          fi
          NO_CACHE_ARG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            NO_CACHE_ARG="--no-cache"
          fi
          BASE_SHA="${{ steps.prep.outputs.base_sha }}"
          BASE_ARG=""
          if [ -n "$BASE_SHA" ]; then
            BASE_ARG="--base $BASE_SHA"
          fi
          FILES_ARG=""
          if [ -f ".enact/changed-files.txt" ] && [ -s ".enact/changed-files.txt" ]; then
            FILES_CSV=$(paste -sd, .enact/changed-files.txt)
            if [ -n "$FILES_CSV" ]; then
              FILES_ARG="--files $FILES_CSV"
            fi
          fi
          MATRIX=$(enact affected --pipeline .enact --workflow ci $BASE_ARG $FILES_ARG $UPDATED_ARG $NO_CACHE_ARG --format json)
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload Showcase Baseline Artifact
        uses: actions/upload-artifact@v7
        with:
          name: showcase-baseline
          path: |-
            .enact/upstream-baseline.json
            .enact/changed-files.txt
            .enact/pr-changes.patch
          retention-days: 1

  preflight:
    name: 'Stage: Preflight'
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository (sparse)
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          fetch-tags: 'false'
          filter: blob:none
          lfs: 'false'
          show-progress: 'false'
          sparse-checkout: |-
            .enact
            cue.mod
            .github
            bin
            tools
            showcase
            patches
            .
            addons/account
            addons/base
            addons/bus
            addons/calendar
            addons/contacts
            addons/crm
            addons/delivery
            addons/fleet
            addons/hr
            addons/hr_attendance
            addons/hr_expense
            addons/hr_holidays
            addons/hr_payroll
            addons/hr_recruitment
            addons/im_livechat
            addons/l10n_generic_coa
            addons/lunch
            addons/mail
            addons/maintenance
            addons/mass_mailing
            addons/mrp
            addons/mrp_subcontracting
            addons/point_of_sale
            addons/pos_restaurant
            addons/project
            addons/purchase
            addons/repair
            addons/sale
            addons/sale_management
            addons/sale_stock
            addons/spreadsheet
            addons/stock
            addons/stock_account
            addons/survey
            addons/uom
            addons/utm
            addons/web
            addons/web_editor
            addons/website
            addons/website_sale
          sparse-checkout-cone-mode: 'false'
          submodules: 'false'

      - name: Download Showcase Baseline & PR Patch
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: showcase-baseline
          path: .enact

      - name: Apply PR Changes Patch
        run: |
          if [ -f ".enact/pr-changes.patch" ] && [ -s ".enact/pr-changes.patch" ]; then
            echo "🩹 Applying PR code changes..."
            git apply --3way .enact/pr-changes.patch 2>/dev/null || git apply --reject .enact/pr-changes.patch 2>/dev/null || true
          fi

      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-

      - name: Ensure enve & enact CLI on PATH
        run: |
          git config --global --add safe.directory "*" 2>/dev/null || true
          mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p -m 0755 /nix 2>/dev/null || true
            sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
          fi
          if [ -d "/nix" ]; then
            if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
              cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
              rm -rf /nix/store 2>/dev/null || true
            fi
            ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
          fi
          BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
          if [ -d "$BIN_DIR" ]; then
            for b in enact enve; do
              if [ -f "$BIN_DIR/$b" ]; then
                cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
                chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
              fi
            done
            echo "$BIN_DIR" >> "$GITHUB_PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"

      - name: Restore Nix Store (L1 GHA Cache)
        id: nix_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-nix-store-${{ hashFiles('**/enve.lock') }}
          path: |-
            /nix/store
            ~/.local/share/enve/store
          restore-keys: |
            ${{ runner.os }}-nix-store-

      - name: Pull Dependencies via enve
        run: |-
          if [ -d "/nix" ]; then
            if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
              cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
              rm -rf /nix/store 2>/dev/null || true
            fi
            ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
          fi
          if [ -f "enve.lock" ]; then
            if [ "${{ steps.nix_l1_cache.outputs.cache-hit }}" != "true" ] && [ -n "$ENACT_R2_BUCKET" ]; then
              enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" --insecure -j 16
            fi
            enve run $([ -f enve.lock ] && echo --locked) -- true
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
          ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
          ENVE_CACHE_CONCURRENCY: '16'

      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            /tmp/.cache/uv
            ~/.cache/pip
            .venv
          restore-keys: ${{ runner.os }}-python-

      - name: Execute Stage [Preflight]
        run: |-
          BASE_SHA="${{ needs.detect.outputs.base_sha }}"
          BASE_ARG=""
          if [ -n "$BASE_SHA" ]; then
            BASE_ARG="--base $BASE_SHA"
          fi
          enact run --pipeline .enact $BASE_ARG preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
          ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}

      - name: Upload Telemetry for [preflight]
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: telemetry-stage-preflight
          path: |-
            .enact/telemetry.json
            .enact/summary.html
          retention-days: 1

  test:
    name: Run Tests (${{ matrix.component }})
    needs:
      - detect
      - preflight
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - name: Checkout Repository (sparse)
        if: ${{ matrix.sparse_checkout != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          fetch-tags: 'false'
          filter: blob:none
          lfs: 'false'
          show-progress: 'false'
          sparse-checkout: ${{ matrix.sparse_checkout }}
          sparse-checkout-cone-mode: 'false'
          submodules: 'false'

      - name: Checkout Repository (full)
        if: ${{ matrix.sparse_checkout == '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          fetch-tags: 'false'
          filter: blob:none
          lfs: 'false'
          show-progress: 'false'
          submodules: 'false'

      - name: Download Showcase Baseline & PR Patch
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: showcase-baseline
          path: .enact

      - name: Apply PR Changes Patch
        run: |
          if [ -f ".enact/pr-changes.patch" ] && [ -s ".enact/pr-changes.patch" ]; then
            echo "🩹 Applying PR code changes..."
            git apply --3way .enact/pr-changes.patch 2>/dev/null || git apply --reject .enact/pr-changes.patch 2>/dev/null || true
          fi

      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-

      - name: Ensure enve & enact CLI on PATH
        run: |
          git config --global --add safe.directory "*" 2>/dev/null || true
          mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p -m 0755 /nix 2>/dev/null || true
            sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
          fi
          if [ -d "/nix" ]; then
            if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
              cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
              rm -rf /nix/store 2>/dev/null || true
            fi
            ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
          fi
          BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
          if [ -d "$BIN_DIR" ]; then
            for b in enact enve; do
              if [ -f "$BIN_DIR/$b" ]; then
                cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
                chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
              fi
            done
            echo "$BIN_DIR" >> "$GITHUB_PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"

      - name: Restore Nix Store (L1 GHA Cache)
        id: nix_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-nix-store-${{ hashFiles('**/enve.lock') }}
          path: |-
            /nix/store
            ~/.local/share/enve/store
          restore-keys: |
            ${{ runner.os }}-nix-store-

      - name: Pull Dependencies via enve
        run: |-
          if [ -d "/nix" ]; then
            if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
              cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
              rm -rf /nix/store 2>/dev/null || true
            fi
            ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
          fi
          if [ -f "enve.lock" ]; then
            if [ "${{ steps.nix_l1_cache.outputs.cache-hit }}" != "true" ] && [ -n "$ENACT_R2_BUCKET" ]; then
              enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" --insecure -j 16
            fi
            enve run $([ -f enve.lock ] && echo --locked) -- true
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
          ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
          ENVE_CACHE_CONCURRENCY: '16'

      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            /tmp/.cache/uv
            ~/.cache/pip
            .venv
          restore-keys: ${{ runner.os }}-python-

      - name: Execute Component Task
        run: eval "$ENACT_MATRIX_COMMAND"
        env:
          CI_COMPONENT: ${{ matrix.component }}
          ENACT_MATRIX_COMMAND: ${{ matrix.command }}
          ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
          ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
          ENACT_TOPOLOGY: ${{ matrix.topology }}

      - name: Upload Telemetry for [${{ matrix.component }}]
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: telemetry-comp-${{ matrix.component }}
          path: |-
            .enact/telemetry.json
            .enact/summary.html
          retention-days: 1

  benchmark:
    name: Showcase Benchmark & Summary
    needs:
      - detect
      - preflight
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          fetch-tags: 'false'
          filter: blob:none
          lfs: 'false'
          show-progress: 'false'
          submodules: 'false'

      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-

      - name: Ensure enve & enact CLI on PATH
        run: |
          BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
          if [ -d "$BIN_DIR" ]; then
            echo "$BIN_DIR" >> "$GITHUB_PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"

      - name: Download Baseline Data
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: showcase-baseline
          path: .enact

      - name: Download All Component Telemetry
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: .enact/telemetry
          pattern: telemetry-*

      - name: Generate Consolidated Telemetry Summary
        continue-on-error: true
        run: |
          if command -v enact >/dev/null 2>&1; then
            enact report --dir .enact/telemetry || true
          fi

      - name: Generate Head-to-Head Benchmark Report
        run: |
          python3 tools/showcase/report-showcase-benchmark.py \
            --workspace "${GITHUB_WORKSPACE:-$PWD}"

      - name: Upload Master Workflow Dashboard
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: enact-workflow-summary
          path: .enact/summary.html
          retention-days: 7
