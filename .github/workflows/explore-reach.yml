name: explore-reach-map
on:
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      samples:
        description: 'Number of stratified seccomp trace samples per component'
        required: false
        default: '50'
      commit:
        description: 'Commit updated trace-reach.bin directly to branch'
        required: false
        default: 'true'

concurrency:
  group: explore-reach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explore:
    name: Explore & Pack Binary Reach Map
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 100
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-

      - name: Ensure enve & enact CLI on PATH
        run: |
          git config --global --add safe.directory "*" 2>/dev/null || true
          BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
          if [ -d "$BIN_DIR" ]; then
            echo "$BIN_DIR" >> "$GITHUB_PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"

      - name: Run Seccomp Reach Exploration
        run: |
          COMMIT_FLAG=""
          if [ "${{ inputs.commit }}" = "true" ]; then
            COMMIT_FLAG="--commit"
          fi
          bash tools/showcase/explore-reach-map.sh -n "${{ inputs.samples || 50 }}" $COMMIT_FLAG

      - name: Upload Binary Reach Map Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trace-reach-bin
          path: .enact/trace-reach.bin
          retention-days: 30

      - name: Push Binary Reach Map to CAS (Cloudflare R2)
        if: always() && hashFiles('.enact/trace-reach.bin') != ''
        continue-on-error: true
        run: |
          if [ -n "$ENACT_R2_BUCKET" ]; then
            echo "🚀 Pushing binary reach map to R2 CAS..."
            enact trace cache push --reach-file .enact/trace-reach.bin --remote-path reach/odoo-trace-reach.bin
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
          ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
