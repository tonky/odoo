[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo"
version = "19.0.0"
description = "Odoo Server & Modular Business Application Framework"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "asn1crypto==1.5.1",
    "Babel==2.10.3",
    "cbor2==5.6.2",
    "chardet==5.2.0",
    "cryptography==42.0.8",
    "docutils==0.20.1",
    "freezegun==1.2.1",
    "geoip2==2.9.0",
    "gevent==24.2.1",
    "greenlet==3.0.3",
    "idna==3.6",
    "Jinja2==3.1.2",
    "libsass==0.22.0",
    "lxml==5.2.1",
    "lxml-html-clean==0.4.4",
    "MarkupSafe==2.1.5",
    "num2words==0.5.13",
    "ofxparse==0.21",
    "openpyxl==3.1.2",
    "passlib==1.7.4",
    "Pillow==10.2.0",
    "polib==1.1.1",
    "psutil==5.9.8",
    "psycopg2-binary==2.9.13",
    "pyopenssl==24.1.0",
    "PyPDF2==2.12.1",
    "pyserial==3.5",
    "python-dateutil==2.8.2",
    "python-ldap==3.4.4",
    "python-magic==0.4.27",
    "python-stdnum==1.19",
    "pytz",
    "pyusb==1.2.1",
    "qrcode==7.4.2",
    "reportlab==4.1.0",
    "rl-renderPM==4.0.3",
    "requests==2.31.0",
    "rjsmin==1.2.0",
    "urllib3==2.0.7",
    "vobject==0.9.6.1",
    "Werkzeug==3.0.1",
    "xlrd==2.0.1",
    "XlsxWriter==3.1.9",
    "xlwt==1.3.0",
    "zeep==4.2.1",
    "websocket-client>=1.9.0",
]

[project.scripts]
odoo-bin = "odoo.cli:main"
odoo = "odoo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo*"]

[tool.uv]
# odoo runs from the checkout (`python odoo-bin`, as upstream does), so the environment holds the
# dependencies only. Installed editable, odoo put its finder on `odoo.addons.__path__`
# ("addons path is not a directory: __editable__.odoo-19.0.0.finder.__path_hook__").
package = false

# What runbot's Ubuntu Noble image adds for the tests (runbot/data/dockerfile_data.xml), at
# Noble's versions; uv syncs the `dev` group by default. Without them addons fail to
# install (account_peppol and its 4 dependents: phonenumbers; cloud_storage_google: google-auth),
# phone_validation formats numbers without phonenumbers, test_lint's pylint and base's SMTPD
# tests skip.
[dependency-groups]
dev = [
    "phonenumbers==8.12.57",
    "google-auth==1.5.1",
    "pylint==3.0.3",
    "astroid==3.0.2",
    "PyJWT==2.7.0",
    "aiosmtpd==1.4.4.post2",
    "pdfminer.six==20221105",
    # docutils highlights test_lint's docstring `code-block`s with it (Noble's python3-docutils
    # recommends python3-pygments): without it test_docstring fails on 9 docstrings.
    "Pygments==2.17.2",
]
